version: '3.8'

# CI-only deltas on top of docker-compose.yml: a scaled-down dask-worker
# and the local Prefect UI URL. Host ports come from .env.ci.example so the
# localhost bindings in the base Compose file also apply to CI.
services:
  dask-worker:
    command: >
      uv run dask worker tcp://dask-scheduler:8786
      --nworkers 2
      --nthreads 1
      --memory-limit 8GB
      --preload src.dask_preload

  prefect-service:
    environment:
      - PREFECT_UI_API_URL=http://localhost:${PREFECT_UI_PORT}/api
